[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wrims-mcp"
version = "0.1.0"
description = "MCP server that gives AI agents structured WRESL+ compile feedback from the WRIMS engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
wrims-mcp = "wrims_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wrims_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
